<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obsidian Web Viewer</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- sidebar toggle -->
<div class="sidebar-toggle-wrap">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
</div>

<!-- sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3L20 9V21H4V9L12 3Z"/><path d="M9 21V12H15V21"/></svg>
    <div>
      <h2 style="cursor:pointer" onclick="navigateHome()">obsidian web viewer</h2>
      <div class="vault-name">web viewer</div>
      <div class="vault-search-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21L16.65 16.65"/></svg>
        <input type="text" placeholder="Search files..." oninput="searchFiles(this.value)">
      </div>
    </div>
  </div>
  <div class="pinned-section" id="pinned-section" style="display:none">
    <div class="tree-section-label">📌 Pinned</div>
    <div id="pinned-items"></div>
    <div class="pinned-divider"></div>
  </div>
  <div class="tree" id="file-tree"></div>
</div>

<!-- context menu -->
<div class="context-menu hidden" id="context-menu">
  <div class="context-menu-item" onclick="contextMenuNewFile()">📄 New File</div>
</div>

<!-- main content -->
<div class="main" id="main">
  <div class="top-bar">
    <span class="file-path" id="file-path">vault/</span>
    <div class="spacer"></div>
    <div class="actions">
      <button class="btn" onclick="promptNewFile()">＋ New</button>
      <button class="btn" id="copy-btn" onclick="copyFileContent()" style="display:none">📋 Copy</button>
      <button class="btn" id="edit-btn" onclick="toggleEdit()">✏️ Edit</button>
      <button class="btn btn-danger" id="delete-btn" onclick="deleteFile()" style="display:none">🗑 Delete</button>
    </div>
  </div>
  <div class="content" id="content">
    <div class="markdown-view" id="view-content"></div>
    <div class="hidden" id="edit-content">
      <div class="editor-header">
        <div class="filename" id="edit-filename"></div>
        <div class="path" id="edit-path"></div>
      </div>
      <div class="edit-tabs" id="edit-tabs" style="display:none">
        <button class="tab-btn tab-active" id="edit-tab-btn" onclick="switchEditTab('edit')">✏️ Edit</button>
        <button class="tab-btn" id="preview-tab-btn" onclick="switchEditTab('preview')">👁 Preview</button>
      </div>
      <div id="editor-area">
        <textarea class="editor-textarea" id="editor"></textarea>
        <div class="edit-actions">
          <button class="btn btn-primary btn-save" onclick="saveFile()">💾 Save</button>
          <button class="btn btn-cancel" onclick="toggleEdit()">Cancel</button>
        </div>
      </div>
      <div class="markdown-view edit-preview" id="edit-preview-area" style="display:none">
        <div id="edit-preview"></div>
      </div>
    </div>
    <div class="hidden" id="newfile-content">
      <div class="newfile-box">
        <h2>📄 New File</h2>
        <div class="newfile-field">
          <label>Path</label>
          <input type="text" id="newfile-path" placeholder="e.g. my-note.md or subfolder/new-note.md" autocomplete="off">
        </div>
        <div class="edit-tabs">
          <button class="tab-btn tab-active" id="nfe-tab-edit" onclick="nfeSwitchTab('edit')">✏️ Edit</button>
          <button class="tab-btn" id="nfe-tab-preview" onclick="nfeSwitchTab('preview')">👁 Preview</button>
        </div>
        <div id="nfe-editor-area">
          <textarea id="newfile-editor" placeholder="Write your content..."></textarea>
        </div>
        <div class="markdown-view edit-preview hidden" id="nfe-preview-area">
          <div id="nfe-preview"></div>
        </div>
        <div class="newfile-actions">
          <button class="btn btn-primary btn-save" onclick="saveNewFile()">💾 Save</button>
          <button class="btn btn-cancel" onclick="cancelNewFile()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
