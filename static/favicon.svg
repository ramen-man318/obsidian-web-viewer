<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 背景: 角丸四角 -->
  <rect x="1" y="1" width="30" height="30" rx="6" ry="6" fill="url(#bg)" stroke="#2d1b69" stroke-width="0.8"/>
  <!-- 三日月 -->
  <path d="M23 3C15 5 7 14 11 29c0 0-3-4-3-10s3-12 11-16s4-0 4-0z"
        fill="url(#moon)" filter="url(#glow)"/>
  <!-- 結晶ファセット -->
  <path d="M19 7l-4 7l5 4l-2-9z" fill="url(#crystal)"/>
  <path d="M15 14l-3 6l5 2l-1-7z" fill="url(#crystal)" opacity="0.5"/>
  <!-- 輝き -->
  <circle cx="17" cy="10" r="0.6" fill="#fff" opacity="0.9"/>
  <circle cx="14" cy="18" r="0.4" fill="#fff" opacity="0.5"/>
</svg>