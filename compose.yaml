services:
  obsidian-web-viewer:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - /home/ramen_man/vault:/app/content
      - pins_data:/data
    environment:
      - TZ=Asia/Tokyo
      - OBSIDIAN_VAULT_PATH=/app/content
      - PINS_FILE=/data/pins.json
    restart: unless-stopped

volumes:
  pins_data: