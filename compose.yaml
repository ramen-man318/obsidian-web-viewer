services:
  obsidian-web-viewer:
    build: .
    user: "1004:1004"
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ${OBSIDIAN_VAULT:-./vault}:/app/content
      - pins_data:/data
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - OBSIDIAN_VAULT_PATH=/app/content
      - PINS_FILE=/data/pins.json
    restart: unless-stopped

volumes:
  pins_data: